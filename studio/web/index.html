<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="studio-token" content="{{TOKEN}}">
  <meta name="studio-version" content="{{VERSION}}">
  <title>AoE3 Mod Studio</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <nav id="nav">
      <div class="brand">
        <img src="icon.svg" alt="" width="28" height="28">
        <div><strong>AoE3 Mod Studio</strong><span id="version"></span></div>
      </div>
      <ul id="nav-list"></ul>
      <div class="nav-foot">
        <select id="lang" aria-label="Language"></select>
        <button id="theme" class="ghost" type="button" aria-label="Theme"></button>
      </div>
    </nav>
    <main id="main" tabindex="-1"></main>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <dialog id="dialog"><form method="dialog" id="dialog-form"></form></dialog>
  <script type="module" src="js/app.js"></script>
</body>
</html>
